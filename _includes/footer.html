{% include base_path %}

<div class="sv-footer">

  <!-- Copyright -->
  <div class="sv-footer-copyright">
    &copy; {{ site.time | date: '%Y' }}
    <strong>Shri Vatssan S</strong>
  </div>


  <!-- Social / Academic Profiles -->
  <div class="sv-footer-socials">

    {% if site.author.googlescholar %}
    <a
      href="{{ site.author.googlescholar }}"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Google Scholar"
      title="Google Scholar"
    >
      <i class="fas fa-graduation-cap" aria-hidden="true"></i>
    </a>
    {% endif %}


    {% if site.author.github %}
    <a
      href="https://github.com/{{ site.author.github }}"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="GitHub"
      title="GitHub"
    >
      <i class="fab fa-github" aria-hidden="true"></i>
    </a>
    {% endif %}


    {% if site.author.linkedin %}
    <a
      href="https://www.linkedin.com/in/{{ site.author.linkedin }}"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="LinkedIn"
      title="LinkedIn"
    >
      <i class="fab fa-linkedin-in" aria-hidden="true"></i>
    </a>
    {% endif %}


    {% if site.author.orcid %}
    <a
      href="{{ site.author.orcid }}"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="ORCID"
      title="ORCID"
    >
      <i class="ai ai-orcid" aria-hidden="true"></i>
    </a>
    {% endif %}

  </div>

</div>
